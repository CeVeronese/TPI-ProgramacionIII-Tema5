<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechnoApp - Login</title>
    <link rel="stylesheet" href="../css/styleLogin.css">
</head>
<body>

    <main>
        <h1>Iniciar sesión</h1>

        <!-- Mensaje de error dinámico (lo usa auth.js si las credenciales fallan) -->
        <p id="mensaje-error" style="color: red;"></p>

        <form id="form-login">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" required>

            <button type="submit">Ingresar</button>
        </form>

        <p style="margin-top: 15px;">
            ¿No tenés cuenta? <a href="registro.html">Registrate acá</a>
        </p>
    </main>

    <script>
        const formulario = document.getElementById("form-login");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            iniciarSesion(email, password);
        });
    </script>

</body>
</html>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../html/inicioCliente.html"></script>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TPI Programación III | Mi Carrito</title>
    
    <!-- Inicialización del tema para evitar parpadeos -->
    <script>
      (() => {
        'use strict';
        const raiz = document.documentElement;
        const CLAVE_ALMACENAMIENTO = 'lte-theme';
        let almacenado = null;
        try {
          almacenado = localStorage.getItem(CLAVE_ALMACENAMIENTO);
        } catch {}
        const resuelto = (almacenado === 'dark' || almacenado === 'light') ? almacenado : 
                         (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        raiz.setAttribute('data-bs-theme', resuelto);
      })();
    </script>

    <!-- Estilos de AdminLTE -->
    <link rel="stylesheet" href="../css/adminlte.css" />
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" crossorigin="anonymous" />
    <!-- Tus estilos propios si los usás -->
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
      
      <!-- Barra superior -->
      <nav class="app-header navbar navbar-expand bg-body">
        <div class="container-fluid">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button"><i class="bi bi-list"></i></a>
            </li>
            <li class="nav-item d-none d-md-block">
              <a href="inicioCliente.html" class="nav-link">Inicio</a>
            </li>
          </ul>
          
          <ul class="navbar-nav ms-auto">
            <!-- Pantalla Completa -->
            <li class="nav-item">
              <a class="nav-link" href="#" data-lte-toggle="fullscreen" aria-label="Pantalla completa">
                <i data-lte-icon="maximize" class="bi bi-arrows-fullscreen"></i>
                <i data-lte-icon="minimize" class="bi bi-fullscreen-exit d-none"></i>
              </a>
            </li>

            <!-- Selector de Tema -->
            <li class="nav-item dropdown">
              <a class="nav-link" href="#" id="bd-theme" aria-label="Cambiar esquema de color" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-sun-fill" data-lte-theme-icon="light"></i>
                <i class="bi bi-moon-fill d-none" data-lte-theme-icon="dark"></i>
                <i class="bi bi-circle-half d-none" data-lte-theme-icon="auto"></i>
              </a>
              <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="bd-theme" style="--bs-dropdown-min-width: 8rem">
                <li>
                  <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="light">
                    <i class="bi bi-sun-fill me-2"></i> Claro
                  </button>
                </li>
                <li>
                  <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark">
                    <i class="bi bi-moon-fill me-2"></i> Oscuro
                  </button>
                </li>
                <li>
                  <button type="button" class="dropdown-item d-flex align-items-center active" data-bs-theme-value="auto">
                    <i class="bi bi-circle-half me-2"></i> Automático
                  </button>
                </li>
              </ul>
            </li>

            <li class="nav-item">
              <a href="login.html" class="nav-link"><i class="bi bi-box-arrow-right"></i></a>
            </li>
          </ul>
        </div>
      </nav>

      <!-- Menú lateral -->
      <aside class="app-sidebar bg-body-secondary shadow">
        <div class="sidebar-brand">
          <a href="inicioCliente.html" class="brand-link">

      <!-- Contenido Principal del Carrito -->
      <main class="app-main">
        <div class="app-content-header">
          <div class="container-fluid">
            <h3>Mi carrito</h3>
          </div>
        </div>

        <div class="app-content">
          <div class="container-fluid">
            <div class="card">
              <div class="card-body">
                
                <!-- Sección rudimentaria donde JS dibuja los productos -->
                <section id="lista-carrito">
                  <!-- Los productos se cargan acá dinámicamente -->
                </section>
                    <div class="mt-4 p-3 rounded border">
                      <h5><i class="bi bi-tag"></i> ¿Tenés un cupón?</h5>

                      <div class="input-group mb-2">
                          <input type="text" id="codigo-cupon" class="form-control" placeholder="Ingresá tu código">
                          <button class="btn btn-primary" onclick="aplicarCupon()">Aplicar</button>
                      </div>

                      <p id="mensaje-cupon" class="mb-0"></p>

                      <button class="btn btn-sm btn-outline-danger mt-2" onclick="quitarCupon()">
                          Quitar cupón
                      </button>
                    </div>

                  <hr>

                  <div class="mt-3">
                      <p id="subtotal">Subtotal: $0</p>
                      <p id="descuento">Descuento: $0</p>
                      <h4 id="total">Total: $0</h4>
                  </div>
                
                <br>
                <button class="btn btn-success" onclick="confirmarPedido()">
                  Confirmar compra
                </button>
                
                <a href="catalogoNuevo.html" class="btn btn-secondary ms-2">Volver al catálogo</a>

              </div>
            </div>
          </div>
        </div>
      </main>

      <footer class="app-footer">
        <div class="float-end d-none d-sm-inline">UTN FRVM</div>
